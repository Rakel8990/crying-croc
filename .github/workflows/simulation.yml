name: 60-day CROC simulation

on:
  workflow_run:
    workflows: ["Rust tests and contract build"]
    types: [completed]

permissions:
  contents: write

jobs:
  simulate:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    env:
      SIMULATION_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the tested main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: source
      - name: Run 60-day simulations and create PNG charts
        working-directory: source
        run: |
          set -euo pipefail
          python3 scripts/simulate_60_days.py --output-dir "$RUNNER_TEMP/croc-simulation"
          python3 scripts/simulate_adaptive_target.py --output-dir "$RUNNER_TEMP/croc-simulation/adaptive_target"
      - name: Check out the ci-logs branch
        uses: actions/checkout@v4
        with:
          ref: ci-logs
          path: ci-logs
      - name: Publish summaries, CSVs and charts to ci-logs
        shell: bash
        run: |
          set -euo pipefail
          destination="ci-logs/$SIMULATION_SHA/simulation"
          mkdir -p "$destination"
          cp -R "$RUNNER_TEMP/croc-simulation/." "$destination/"
          git -C ci-logs config user.name "github-actions[bot]"
          git -C ci-logs config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C ci-logs add "$SIMULATION_SHA/simulation"
          if git -C ci-logs diff --cached --quiet; then
            echo "Simulation output for $SIMULATION_SHA already exists."
          else
            git -C ci-logs commit -m "Add 60-day simulation for $SIMULATION_SHA"
            pushed=false
            for attempt in 1 2 3; do
              if git -C ci-logs push origin HEAD:ci-logs; then
                pushed=true
                break
              fi
              if (( attempt < 3 )); then
                git -C ci-logs fetch origin ci-logs
                git -C ci-logs rebase origin/ci-logs
                sleep "$((attempt * 2))"
              fi
            done
            [[ "$pushed" == true ]] || { echo "Could not publish simulation output after 3 push attempts."; exit 1; }
          fi
