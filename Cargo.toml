[package]
name = "crying-croc"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.17.2"
near-contract-standards = "=5.17.2"

[dev-dependencies]
near-sdk = { version = "=5.17.2", features = ["unit-testing"] }
near-workspaces = "=0.23.0"
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread"] }

[profile.release]
overflow-checks = true
