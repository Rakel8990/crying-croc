name: Rust tests and contract build

on:
  push:
    branches-ignore:
      - ci-logs

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run unit tests, build Wasm, and run sandbox gas test
        id: cargo
        shell: bash
        run: |
          set +e
          output_file="$RUNNER_TEMP/croc-cargo-output.log"
          : > "$output_file"

          cargo test --lib 2>&1 | tee -a "$output_file"
          unit_status=${PIPESTATUS[0]}

          cargo build --target wasm32-unknown-unknown --release 2>&1 | tee -a "$output_file"
          build_status=${PIPESTATUS[0]}

          integration_status=125
          if [ "$unit_status" -eq 0 ] && [ "$build_status" -eq 0 ]; then
            cargo test --test settle_gas -- --nocapture 2>&1 | tee -a "$output_file"
            integration_status=${PIPESTATUS[0]}
          else
            echo "Sandbox gas test skipped because unit tests or Wasm build failed." | tee -a "$output_file"
          fi

          if [ "$unit_status" -eq 0 ] && [ "$build_status" -eq 0 ] && [ "$integration_status" -eq 0 ]; then
            conclusion="SUCCESS (unit tests: 0, cargo build: 0, sandbox gas test: 0)"
          else
            conclusion="FAIL (unit tests: $unit_status, cargo build: $build_status, sandbox gas test: $integration_status)"
          fi

          echo "CROC_CI_CONCLUSION=$conclusion" >> "$GITHUB_ENV"
          if [ "$unit_status" -ne 0 ] || [ "$build_status" -ne 0 ] || [ "$integration_status" -ne 0 ]; then
            exit 1
          fi
      - name: Publish the latest log on the ci-logs orphan branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/croc-cargo-output.log"
          report_file="$RUNNER_TEMP/ci-latest.txt"
          log_repo="$RUNNER_TEMP/croc-ci-log-repo-$GITHUB_RUN_ID"

          {
            echo "Commit SHA: $GITHUB_SHA"
            echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Final conclusion: ${CROC_CI_CONCLUSION:-FAIL}"
            echo "Last 300 lines of Cargo output:"
            if [ -f "$output_file" ]; then
              tail -n 300 "$output_file"
            else
              echo "Cargo output was not created."
            fi
          } > "$report_file"

          mkdir -p "$log_repo"
          cp "$report_file" "$log_repo/ci-latest.txt"
          cd "$log_repo"
          git init --quiet --initial-branch=ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-latest.txt
          git commit --quiet -m "Update CI log for $GITHUB_SHA"
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth_header" push --force "https://github.com/$GITHUB_REPOSITORY.git" HEAD:ci-logs
