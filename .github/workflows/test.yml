name: Rust tests and contract build

on:
  push:
    branches-ignore:
      - ci-logs

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check out the ci-logs branch
        uses: actions/checkout@v4
        with:
          ref: ci-logs
          path: ci-logs
      - name: Run actionlint v1.7.12
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" --workdir /repo rhysd/actionlint:1.7.12
      - name: Install stable Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run unit tests and build Wasm
        id: cargo
        shell: bash
        run: |
          set +e
          output_file="$RUNNER_TEMP/croc-cargo-output.log"
          : > "$output_file"

          cargo test --lib 2>&1 | tee -a "$output_file"
          unit_status=${PIPESTATUS[0]}

          cargo build --target wasm32-unknown-unknown --release 2>&1 | tee -a "$output_file"
          build_status=${PIPESTATUS[0]}

          if [ "$unit_status" -eq 0 ] && [ "$build_status" -eq 0 ]; then
            conclusion="SUCCESS (unit tests: 0, cargo build: 0)"
          else
            conclusion="FAIL (unit tests: $unit_status, cargo build: $build_status)"
          fi

          echo "CROC_CI_CONCLUSION=$conclusion" >> "$GITHUB_ENV"
          if [ "$unit_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            exit 1
          fi
      - name: Publish the latest log to ci-logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/croc-cargo-output.log"
          report_file="$RUNNER_TEMP/ci-latest.txt"
          log_repo="$GITHUB_WORKSPACE/ci-logs"

          {
            echo "Commit SHA: $GITHUB_SHA"
            echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Final conclusion: ${CROC_CI_CONCLUSION:-FAIL}"
            echo "Last 300 lines of Cargo output:"
            if [ -f "$output_file" ]; then
              tail -n 300 "$output_file"
            else
              echo "Cargo output was not created."
            fi
          } > "$report_file"

          cp "$report_file" "$log_repo/ci-latest.txt"
          git -C "$log_repo" config user.name "github-actions[bot]"
          git -C "$log_repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$log_repo" add ci-latest.txt
          if ! git -C "$log_repo" diff --cached --quiet; then
            git -C "$log_repo" commit --quiet -m "Update CI log for $GITHUB_SHA"
            pushed=false
            for attempt in 1 2 3; do
              if git -C "$log_repo" push origin HEAD:ci-logs; then
                pushed=true
                break
              fi
              if (( attempt < 3 )); then
                git -C "$log_repo" fetch origin ci-logs
                git -C "$log_repo" rebase origin/ci-logs
                sleep "$((attempt * 2))"
              fi
            done
            [[ "$pushed" == true ]] || { echo "Could not publish the CI log after 3 push attempts."; exit 1; }
          fi
